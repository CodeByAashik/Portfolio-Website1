<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
    <link rel="shortcut icon" href="../icon.png" type="image/x-icon">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');
        
        * {
            margin: 0px;
            padding: 0px;
            box-sizing: border-box; 
        }

        .container{
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            width: 100vw;
        }

        body {
            background: url('rpcbg.jpg');
            background-position: center;
            background-repeat: no-repeat;
            background-size: cover;
            font-family: 'Poppins', sans-serif;
            overflow-x: hidden;
            position: relative;
        }

        #gametitle {
            font-size: 42px;
            text-align: center;
            font-weight: 700;
            margin-top: 30px;
            color: white;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            text-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
            animation: fadeInDown 1s ease-out;
            letter-spacing: 2px;
            padding: 20px 90px;
            border-radius: 20px;
        }

        .buttons {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 40px;
            gap: 30px;
            animation: fadeInUp 1s ease-out 0.3s both;
        }

        .rpc-buttons {
            height: 130px;
            width: 140px;
            border: none;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            font-size: 3.6rem;
            font-weight: 600;
            color: #4a5568;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: all 0.3s;
        }

        .rpc-buttons:hover{
            transform: translateY(-10px);
        }

        button {
            padding: 12px 24px;
            margin-top: 15px;
            border-radius: 25px;
            border: none;
            background: linear-gradient(145deg, #667eea, #764ba2);
            color: white;
            font-weight: 500;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 0 15px rgba(102, 126, 234, 0.4);
            margin: 0 10px;
        }

        .result {
            display: flex;
            width: 100vw;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin-top: 40px;
            animation: fadeInUp 1s ease-out 0.6s both;
        }

        .result #resultText {
            font-size: 1.5;
            color: white;
            margin-bottom: 30px;
            text-align: center;
            font-weight: 500;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 20px 40px;
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .result #resultText span {
            font-size: 2rem;
            font-weight: 700;
        }

        .result #resultText:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.15);
        }

        .score-container {
            display: flex;
            gap: 30px;
            margin-bottom: 30px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .score-item {
            background: rgba(255, 255, 255, 0.15);
            padding: 20px 30px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            text-align: center;
            transition: all 0.3s ease;
            min-width: 120px;
        }
        .result h3 {
            font-size: 16px;
            color: rgba(255, 255, 255, 0.8);
            margin-bottom: 5px;
            font-weight: 500;
        }

        .score-value {
            font-size: 28px;
            font-weight: 700;
            color: white;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
        }

        .extra-buttons {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .note{
            font-size: 16px;
            color: white;
            text-align: center;
            background-color: rgba(242, 11, 11, 0.484);
            backdrop-filter: blur(10px);
            padding: 10px 40px;
            margin-top: 30px;
        }

        /* Responsive design */
        @media (max-width: 768px) {
            p {
                font-size: 32px;
                margin-top: 20px;
            }
            
            .rpc-buttons {
                height: 100px;
                width: 100px;
                font-size: 20px;
            }
            
            .buttons {
                gap: 20px;
            }
            
            .result #resultText {
                font-size: 20px;
                padding: 15px 25px;
                margin: 0 20px;
            }
            
            .score-container {
                gap: 15px;
            }
            
            .score-item {
                padding: 15px 20px;
                min-width: 100px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <p id="gametitle">Rock Paper Scissors</p> 

        <div class="buttons">
            
            <button class="rpc-buttons" id="js-rock-button" title="Rock">✊</button>
    
            <button class="rpc-buttons" id="js-paper-button">✋</button>
    
            <button class="rpc-buttons" id="js-scissors-button"> ✌️</button>
    
            
     
        </div>
        <div class="result">
            <p id="resultText">Click a button to play!</p>
            <div class="score-container">
                <div class="score-item">
                    <h3>Wins</h3>
                    <div class="score-value" id="Wins">0</div>
                </div>
                <div class="score-item">
                    <h3>Loses</h3>
                    <div class="score-value" id="Loses">0</div>
                </div>
                <div class="score-item">
                    <h3>Ties</h3>
                    <div class="score-value" id="Ties">0</div>
                </div>
            </div>
            <div class="extra-buttons">
                <button onclick="
                    score.wins=0;
                    score.loses=0;
                    score.ties=0;
                    displayScores();
                    localStorage.removeItem('score');
                ">Reset</button>
        
                    <button onclick="
                        autoPlay();
                    ">Auto Play</button>
            </div>
            <div class="note">
                <p>Note : Press R for Rock, P for Paper, S for Scissors</p>
            </div>
        </div>
    </div>
    <script>
        
        let score = JSON.parse(localStorage.getItem('score')) || {
                wins:0,
                loses:0,
                ties:0
            };
     
        



        let result = '';
        let winsText = document.getElementById('Wins');
        let losesText = document.getElementById('Loses');
        let tiesText = document.getElementById('Ties');
        let resultText = document.getElementById('resultText');


        let rockButton = document.getElementById('js-rock-button');
        let paperButton = document.getElementById('js-paper-button');   
        let scissorsButton = document.getElementById('js-scissors-button');

        function pickComputerMove(){
            const RandomNumber2=Math.random();
            if(RandomNumber2 >= 0 && RandomNumber2 < 1/3){
                return 'Rock';
            } else if(RandomNumber2 >= 1/3 && RandomNumber2 <2/3){
                return 'Paper';
            }else{
                return 'Scissors';
            }
        }


        function playGame(playerMove){
            let computerMove = pickComputerMove();
            if(playerMove === 'Scissors'){
                if(computerMove === 'Rock'){
                    result='Computer Won';
                }else if(computerMove === 'Paper'){
                    result='You Won';
                }else{
                    result='Theres Tie';
                }
            } else if(playerMove === 'Paper'){
                if(computerMove === 'Rock'){
                    result='You Won';
                }else if(computerMove === 'Paper'){
                    result='Theres Tie';
                }else{
                    result='Computer Won';
                }
            }else if(playerMove === 'Rock'){
                if(computerMove === 'Rock'){
                    result='Theres Tie';
                }else if(computerMove === 'Paper'){
                    result='Computer Won';
                }else{
                    result='You Won';
                }
            }
            
            if(result === 'You Won'){
                score.wins+=1;
            }else if(result === 'Computer Won'){
                score.loses+=1;
            }else if(result === 'Theres Tie'){
                score.ties+=1;
            }

            localStorage.setItem('score',JSON.stringify(score));
            // alert(`You choose ${playerMove} , Computer choose ${computerMove} . ${result}\n Wins: ${score.wins}\n Loses : ${score.loses}\n Ties:${score.ties}`);    
            displayScores(playerMove, computerMove);

        }


        rockButton.addEventListener('click', () =>{
            playGame('Rock');
        });
        paperButton.addEventListener('click', () =>{
            playGame('Paper');
        });
        scissorsButton.addEventListener('click', () =>{
            playGame('Scissors');
        });


        document.body.addEventListener('keydown', (event) => {
            if(event.key === 'R' || event.key === 'r'){
                playGame('Rock');
            }else if(event.key === 'P' || event.key === 'p'){
                playGame('Paper');
            }else if(event.key === 'S' || event.key === 's'){
                playGame('Scissors');
            }
        })

        
        function displayScores(playerMove,computerMove) {
            if(computerMove === 'Rock'){
                computerMove = '✊';
            } else if(computerMove === 'Paper'){
                computerMove = '✋';
            } else if(computerMove === 'Scissors'){
                computerMove = '✌️';
            }

            if(playerMove === 'Rock'){
                playerMove = '✊';
            } else if(playerMove === 'Paper'){
                playerMove = '✋';
            } else if(playerMove === 'Scissors'){
                playerMove = '✌️';
            }
            if(score.wins === 0 && score.loses === 0 && score.ties === 0) {
                resultText.textContent = 'Scores have been reset!';
                winsText.textContent = '0';
                losesText.textContent = '0';     
                tiesText.textContent = '0';  
            }else{
                resultText.innerHTML = `You <span> ${playerMove}</span> / <span> ${computerMove}</span> Computer ${result}`;
                winsText.textContent = score.wins;
                losesText.textContent = score.loses;     
                tiesText.textContent = score.ties;   
            }
        } 

        let intervalID;
        let isAutoPlaying = false;
        function autoPlay(){
            if(!isAutoPlaying){
                intervalID = setInterval(function(){
                    const playermove = pickComputerMove();
                    playGame(playermove);
                },1000);  
                isAutoPlaying = true;
            }else{
                clearInterval(intervalID);
                isAutoPlaying = false;
            }
        }
        
    </script>
</body>
</html>
