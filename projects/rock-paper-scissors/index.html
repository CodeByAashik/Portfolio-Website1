<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
    <link rel="shortcut icon" href="../icon.png" type="image/x-icon">
    <link rel="stylesheet" href="rps.css">
</head>
<body>
    <div class="container">
        <p id="gametitle">Rock Paper Scissors</p> 

        <div class="buttons">
            
            <button class="rpc-buttons" id="js-rock-button" title="Rock">✊</button>
    
            <button class="rpc-buttons" id="js-paper-button">✋</button>
    
            <button class="rpc-buttons" id="js-scissors-button"> ✌️</button>
    
            
     
        </div>
        <div class="result">
            <p id="resultText">Click a button to play!</p>
            <div class="score-container">
                <div class="score-item">
                    <h3>Wins</h3>
                    <div class="score-value" id="Wins">0</div>
                </div>
                <div class="score-item">
                    <h3>Loses</h3>
                    <div class="score-value" id="Loses">0</div>
                </div>
                <div class="score-item">
                    <h3>Ties</h3>
                    <div class="score-value" id="Ties">0</div>
                </div>
            </div>
            <div class="extra-buttons">
                <button onclick="
                    score.wins=0;
                    score.loses=0;
                    score.ties=0;
                    displayScores();
                    localStorage.removeItem('score');
                ">Reset</button>
        
                    <button onclick="
                        autoPlay();
                    ">Auto Play</button>
            </div>
            <div class="note">
                <p>Note : Press R for Rock, P for Paper, S for Scissors</p>
            </div>
        </div>
    </div>
    <script src="rps.js"></script>
</body>
</html>
