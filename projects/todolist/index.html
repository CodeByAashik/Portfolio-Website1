<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ToDo List App</title>
  <script src="https://kit.fontawesome.com/cd6860e8dd.js" crossorigin="anonymous"></script>
  <link rel="shortcut icon" href="../icon.png" type="image/x-icon">
  <link rel="stylesheet" href="todolist.css">

</head>
<body>
  <div class="container">
    <h1><i class="fa-solid fa-book"></i> ToDo List</h1>
    <div class="form-group">
      <input type="text" id="todonameip" placeholder="Enter todo..." />
      <input type="date" id="tododateip" />
      <button onclick="addTodo()">Add</button>
    </div>
    <table>
      <thead>
        <tr>
          <th>Task</th>
          <th>Date</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody id="todoItems"></tbody>
    </table>
  </div>
  <p>designed by : <a href="https://www.aashikthakur.com.np">Aashik Thakur</a></p>
  <div id="toast" class="toast"></div>
 <script src="todolist.js"></script>
</body>
</html>
