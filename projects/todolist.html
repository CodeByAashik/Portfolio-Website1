<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ToDo List App</title>
  <script src="https://kit.fontawesome.com/cd6860e8dd.js" crossorigin="anonymous"></script>
  <style>
    
    * {
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    :root{
        --basecolor: hsl(46, 35%, 43%);
        
    }

    body {
      margin: 0;
      padding: 0;
      background: hsl(from var(--basecolor) h s calc(l));
      color: hsl(from var(--basecolor) h s calc(l - 15));
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      background: hsl(from var(--basecolor) h s calc(l + 15));
      border-radius: 16px;
      padding: 30px;
      box-shadow: 0 0px 20px hsl(from var(--basecolor) h s calc(l + 5));
      width: 90%;
      max-width: 600px;
      z-index: 1;
    }

    h1 {
      text-align: center;
      color: hsl(from var(--basecolor) h s calc(l - 15));
      /* text-shadow: 0 0px 5px hsl(from var(--basecolor) h s calc(l - 15)); */
      margin-bottom: 40px;
    }

    .form-group {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    input[type="text"],
    input[type="date"] {
      background: hsl(from var(--basecolor) h s calc(l + 60)); 
      flex: 1;
      padding: 12px;
      border: 1.5px solid #ccc;
      border-radius: 8px;
      font-size: 1rem;
      transition: 0.3s;
    }

    input:focus {
      border-color: orange;
      outline: none;
    }

    button {
      padding: 12px 20px;
      border: none;
      background: orange;
      color: white;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      transition: 0.3s ease;
    }

    button:hover {
      background-color: rgb(196, 127, 0);
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th, td {
      padding: 12px;
      text-align: left;
    }

    tr:nth-child(even) {
        position: relative;
        z-index: 111;
    }
    
    tr:nth-child(even):after{
        content: '';
        background-color: hsl(from var(--basecolor) h s calc(l + 20));
        filter: blur(17px);
        width: 100%;
        height: 100%;
        position: absolute;
        top: 0px;
        left: 0px;
        z-index: -1;
    }

    .remove-btn {
      background-color: #e74c3c;
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
    }

    .remove-btn:hover {
      background-color: #c0392b;
    }

    .toast {
      position: fixed;
      bottom: 30px;
      right: 30px;
      background: #333;
      color: #fff;
      padding: 12px 20px;
      border-radius: 6px;
      display: none;
      opacity: 0.95;
    }

    p{
      text-transform: capitalize;
      color: hsl(from var(--basecolor) h s calc(l - 15));
    }

    p a{
      text-decoration: none;
      font-weight: bold;
      color: inherit;
      /* color: hsl(from var(--basecolor) h s calc(l + 20)); */
      color: hsl(from var(--basecolor) h s calc(l - 15));
    }
 
  </style>
</head>
<body>
  <div class="container">
    <h1><i class="fa-solid fa-book"></i> ToDo List</h1>
    <div class="form-group">
      <input type="text" id="todonameip" placeholder="Enter todo..." />
      <input type="date" id="tododateip" />
      <button onclick="addTodo()">Add</button>
    </div>
    <table>
      <thead>
        <tr>
          <th>Task</th>
          <th>Date</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody id="todoItems"></tbody>
    </table>
  </div>
  <p>designed by : <a href="https://www.aashikthakur.com.np">Aashik Thakur</a></p>

  <div id="toast" class="toast"></div>

  <script>
        const todoTableElem = document.getElementById('todoItems'); 
        let todoArray = JSON.parse(localStorage.getItem('prevTodo')) || [];
        renderTodos();
        function addTodo(){
            let name = document.getElementById('todonameip').value;
            let date = document.getElementById('tododateip').value;
            if(name && date){
                todoArray.push(
                    {
                        //name : todoname ,
                        //date : tododate

                        name,date
                    }
                );
                renderTodos();
                document.getElementById('todonameip').value = '';
                document.getElementById('tododateip').value = '';
            }    
        }

        function renderTodos(){
            let tablehtml = ``;
            // for(let i =0 ; i < todoArray.length ; i++){
            //     tablehtml += `<tr><td>${todoArray[i].name}</td><td>${todoArray[i].date}</td><td><button onclick="
            //         todoArray.splice(${i},1);
            //         renderTodos();
            //     ">Delete</button></td></tr>`;
            // }
            todoArray.forEach(function(value,index){
              tablehtml+=`<tr><td>${value.name}</td><td>${value.date}</td><td><button onclick = "
                  deleteTodo(${index});
                ">Delete</button></td></tr>`
            })
            todoTableElem.innerHTML = tablehtml;
            localStorage.setItem('prevTodo',JSON.stringify(todoArray));

        }

        // delete logic 
        function deleteTodo(index){
          todoArray.splice(index,1);
          renderTodos();
        }


        // function to be added later 
        // function setAccent(){
        //     let newvalue = document.getElementById('accent').value;
        //     document.documentElement.style.setProperty('--basecolor', 'newvalue');
        // }
  </script>
</body>
</html>
