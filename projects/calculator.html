<!DOCTYPE html>
<html lang="en">
<head>
    <title>Document</title>
   <style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    color: white;
  }
  @font-face {
    font-family: display;
    src: url(digital-7\ \(mono\ italic\).ttf);
  }

  body {
    background-color: #121212;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
  }

  .calculator {
    width: 360px;
    background-color: #1e1e1e;
    border-radius: 20px;
    padding: 20px;
    /* box-shadow: 0 8px 30px rgba(0, 255, 204, 0.1); */
  }

  .display {
    width: 100%;
    height: 60px;
    background-color: #2b2b2b;
    color: #00ffcc;
    font-size: 35px;
    font-weight: bold;
    border: none;
    padding: 15px 20px;
    border-radius: 12px;
    margin-bottom: 20px;
    text-align: right;
    box-shadow: inset 0 0 8px rgba(0, 255, 204, 0.2);
    font-family: 'display','Times New Roman', Times, serif;
  }

  .row1, .row2, .row3, .row4 {
    display: flex;
    justify-content: space-between;
    margin-bottom: 15px;
  }

  button {
    width: 70px;
    height: 70px;
    border-radius: 50%;
    border: none;
    font-size: 22px;
    cursor: pointer;
    box-shadow: 0 2px 6px rgba(0, 255, 204, 0.15);
    transition: all 0.25s ease-in-out;
  }

  .number {
    background-color: #2d2d2d;
    opacity: 0.6;
  }

  .number:hover {
    background-color: #444;
    opacity: 1;
    transform: scale(1.05);
    box-shadow: 0 0 10px rgba(0, 255, 204, 0.4);
  }

  .plus, .minus, .multiply {
    background-color: #ff9500;
    color: white;
    font-weight: bold;
  }

  .plus:hover, .minus:hover, .multiply:hover {
    background-color: #ffa733;
    transform: scale(1.05);
    box-shadow: 0 0 12px rgba(255, 149, 0, 0.4);
  }

  .equals {
    background-color: #007aff;
    color: white;
    font-weight: bold;
  }

  .equals:hover {
    background-color: #339dff;
    transform: scale(1.05);
    box-shadow: 0 0 12px rgba(0, 122, 255, 0.4);
  }

  .clear {
    background-color: #ff3b30;
  }

  .clear:hover {
    background-color: #ff5c5c;
    transform: scale(1.05);
    box-shadow: 0 0 10px rgba(255, 59, 48, 0.4);
  }
</style>

</head>
<body>

<div class="calculator">
    <input type="text" readonly class="display" id="display">
    <div class="row1">
        <button class="number one" onclick="
            updateCalculation('1');
          ">1</button>
        <button class="number two" onclick="
            updateCalculation('2');
          ">2</button>
        <button class="number three" onclick="
            updateCalculation('3');
          ">3</button>
        <button class="plus" onclick="
            updateCalculation('+');
          ">+</button>
    </div>
    <div class="row2">
        <button class="number four" onclick="
            updateCalculation('4');
          ">4</button>
        <button class="number five" onclick="
            updateCalculation('5');
          ">5</button>
        <button class="number six" onclick="
            updateCalculation('6');
          ">6</button>
        <button class="minus" onclick="
            updateCalculation('-');
          ">-</button>
    </div>
    <div class="row3">
        <button class="number seven" onclick="
            updateCalculation('7');
          ">7</button>
        <button class="number eight" onclick="
            updateCalculation('8');
          ">8</button>
        <button class="number nine" onclick="
            updateCalculation('9');
          ">9</button>
        <button class="multiply" onclick="
            updateCalculation('*');
          ">*</button>
    </div>
    <div class="row4">
        <button class="number zero" onclick="
            updateCalculation('0');
            ">0</button>
        <button class="number decimal" onclick="
            updateCalculation('.');
            display();
            ">.</button>
        <button class="number clear" onclick="
            clear();
            ">Clr</button>
        <button class="equals" onclick="
            calculate();
            ">=</button>
    </div>
  </div>
  <script>
    let recentCalculation = localStorage.getItem('recent')|| '';
    console.log(recentCalculation);    

    function display(){
      document.getElementById('display').value=calculation;
    }
    
    calculation='';
    function updateCalculation(value){
      calculation+=value;
      // console.log(calculation);
      localStorage.setItem('recent',calculation);
      display();
    }


    function clear(){
      calculation='';
      localStorage.setItem('recent',calculation);
      display();
    }

    function calculate(){
      calculation=eval(calculation);
      display();
      localStorage.setItem('recent',calculation);
    }

    function backsp(){
      calculation=calculation.slice(0,-1);
      display();
    }


    document.addEventListener('keydown', function(event) {
    const key = event.key;

    if (!isNaN(key) || "+-*/.".includes(key)) {
      updateCalculation(key);
    } else if (key === "Enter") {
      calculate();
    } else if (key === "Backspace") {
      backsp();
    } else if (key === "Escape") {
      clear();
    }});
</script>
</body>
</html>
