<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calculator | Aashik Thakur</title>
  <link rel="shortcut icon" href="/icon.png" type="image/x-icon">
  <style>
    @font-face {
      font-family: 'Digital7Italic';
      src: url(/fonts/digital-7\ \(mono\ italic\).ttf);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #121212;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      color: white;
      padding: 20px;
    }

    .calculator {
      width: 100%;
      max-width: 360px;
      background-color: #1e1e1e;
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    .display {
      width: 100%;
      height: 60px;
      background-color: #2b2b2b;
      color: #00ffcc;
      font-size: 35px;
      font-weight: bold;
      border: none;
      padding: 15px 20px;
      border-radius: 12px;
      margin-bottom: 20px;
      text-align: right;
      box-shadow: inset 0 0 8px rgba(0, 255, 204, 0.2);
      font-family: 'Digital7Italic', monospace;
    }

    .row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 15px;
    }

    button {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      border: none;
      font-size: 22px;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0, 255, 204, 0.15);
      transition: all 0.25s ease-in-out;
    }

    .number {
      background-color: #2d2d2d;
      opacity: 0.6;
      color: white;
    }

    .number:hover {
      background-color: #444;
      opacity: 1;
      transform: scale(1.05);
      box-shadow: 0 0 10px rgba(0, 255, 204, 0.4);
    }

    .plus, .minus, .multiply {
      background-color: #ff9500;
      color: white;
      font-weight: bold;
    }

    .plus:hover, .minus:hover, .multiply:hover {
      background-color: #ffa733;
      transform: scale(1.05);
      box-shadow: 0 0 12px rgba(255, 149, 0, 0.4);
    }

    .equals {
      background-color: #007aff;
      color: white;
      font-weight: bold;
    }

    .equals:hover {
      background-color: #339dff;
      transform: scale(1.05);
      box-shadow: 0 0 12px rgba(0, 122, 255, 0.4);
    }

    .clear {
      background-color: #ff3b30;
      color: white;
    }

    .clear:hover {
      background-color: #ff5c5c;
      transform: scale(1.05);
      box-shadow: 0 0 10px rgba(255, 59, 48, 0.4);
    }

    footer {
      margin-top: 25px;
      font-size: 14px;
      text-align: center;
      color: #999;
    }

    footer a {
      color: #00ffcc;
      text-decoration: none;
    }

    footer a:hover {
      text-decoration: underline;
    }

    @media (max-width: 400px) {
      button {
        width: 60px;
        height: 60px;
        font-size: 20px;
      }
    }
  </style>
</head>
<body>

  <div class="calculator">
    <input type="text" readonly class="display" id="display" />
    <div class="row">
      <button class="number" onclick="updateCalculation('1')">1</button>
      <button class="number" onclick="updateCalculation('2')">2</button>
      <button class="number" onclick="updateCalculation('3')">3</button>
      <button class="plus" onclick="updateCalculation('+')">+</button>
    </div>
    <div class="row">
      <button class="number" onclick="updateCalculation('4')">4</button>
      <button class="number" onclick="updateCalculation('5')">5</button>
      <button class="number" onclick="updateCalculation('6')">6</button>
      <button class="minus" onclick="updateCalculation('-')">-</button>
    </div>
    <div class="row">
      <button class="number" onclick="updateCalculation('7')">7</button>
      <button class="number" onclick="updateCalculation('8')">8</button>
      <button class="number" onclick="updateCalculation('9')">9</button>
      <button class="multiply" onclick="updateCalculation('*')">*</button>
    </div>
    <div class="row">
      <button class="number" onclick="updateCalculation('0')">0</button>
      <button class="number" onclick="updateCalculation('.')">.</button>
      <button class="clear" onclick="clearCalc()">Clr</button>
      <button class="equals" onclick="calculate()">=</button>
    </div>
  </div>

  <footer>
    Designed by <a href="https://www.aashikthakur.com.np" target="_blank">Aashik Thakur</a>
  </footer>

  <script>
    let calculation = '';
    let recentCalculation = localStorage.getItem('recent') || '';
    if (recentCalculation) calculation = recentCalculation;

    function display() {
      document.getElementById('display').value = calculation;
    }

    function updateCalculation(value) {
      calculation += value;
      localStorage.setItem('recent', calculation);
      display();
    }

    function clearCalc() {
      calculation = '';
      localStorage.setItem('recent', calculation);
      display();
    }

    function calculate() {
      try {
        calculation = eval(calculation).toString();
        display();
        localStorage.setItem('recent', calculation);
      } catch (error) {
        console.error("Error in calculation: ", error);
        const displayEl = document.getElementById('display');
        displayEl.style.color = 'red';
        displayEl.value = 'Error!';
        setTimeout(() => {
          displayEl.style.color = '#00ffcc';
          display();
        }, 1500);
      }
    }

    function backsp() {
      calculation = calculation.slice(0, -1);
      display();
    }

    document.addEventListener('keydown', function (event) {
      const key = event.key;
      if (!isNaN(key) || "+-*/.".includes(key)) {
        updateCalculation(key);
      } else if (key === "Enter") {
        calculate();
      } else if (key === "Backspace") {
        backsp();
      } else if (key === "Escape") {
        clearCalc();
      }
    });

    display(); // initial display
  </script>

</body>
</html>
